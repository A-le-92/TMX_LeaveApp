<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Signing in...</title>
<script src="https://res.cdn.office.net/teams-js/2.19.0/js/MicrosoftTeams.min.js"></script>
<script src="https://alcdn.msauth.net/browser/2.38.3/js/msal-browser.min.js"></script>
</head>
<body>
<p>Finishing sign-in...</p>
<script>
microsoftTeams.app.initialize().then(function () {
  const msalConfig = {
    auth: {
      clientId: 'b9b714d6-c484-4f56-9bda-590649b5ec12',
      authority: 'https://login.microsoftonline.com/transmutex.onmicrosoft.com',
      redirectUri: window.location.origin + '/auth-end.html'
    },
    cache: { cacheLocation: 'localStorage', storeAuthStateInCookie: true }
  };
  const msalInstance = new msal.PublicClientApplication(msalConfig);
  msalInstance.initialize().then(function () {
    msalInstance.handleRedirectPromise().then(function (result) {
      if (result && result.account) {
        microsoftTeams.authentication.notifySuccess('success');
      } else {
        const accounts = msalInstance.getAllAccounts();
        if (accounts.length > 0) {
          microsoftTeams.authentication.notifySuccess('success');
        } else {
          microsoftTeams.authentication.notifyFailure('no-account-found');
        }
      }
    }).catch(function (err) {
      microsoftTeams.authentication.notifyFailure(err.message || 'unknown-error');
    });
  });
});
</script>
</body>
</html>
